<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音访谈生成 Skill · Wowgrowth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <style>
    :root {
      --coral: #FF4F9A;
      --violet: #FF4F9A;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; overflow-x: hidden; }

    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .fork-cite {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 650;
      max-width: min(420px, 52vw);
    }
    .fork-cite a {
      color: var(--pink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .fork-cite a:hover { color: var(--pink-deep); }
    .fork-cite a:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .scenario {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 650;
    }
    .scenario select {
      border: 0; background: transparent; outline: 0;
      font: inherit; font-weight: 650; color: var(--ink);
    }
    .top-actions { display: flex; gap: 8px; }
    .chip {
      border: 1px solid rgba(26,35,50,.08);
      background: rgba(255,255,255,.65);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px; font-weight: 650;
      color: var(--muted);
    }
    .chip.on { color: var(--pink); border-color: rgba(255,79,154,.28); background: var(--pink-soft); }

    .stage {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 28px 40px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr);
      gap: 22px;
      min-height: calc(100vh - 90px);
    }

    .orb-panel {
      border-radius: 28px;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      position: relative;
      min-height: 620px;
    }
    .orb-stage {
      position: relative;
      display: grid;
      place-items: center;
      padding: 40px 24px 20px;
    }
    .orb {
      width: min(340px, 56vw);
      height: min(340px, 56vw);
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), transparent 35%),
        radial-gradient(circle at 50% 50%, #F7C9DC 0%, #C9CDD4 32%, #9AA0AB 58%, transparent 72%);
      filter: blur(0);
      box-shadow:
        0 0 80px rgba(255,79,154,.28),
        0 0 160px rgba(201,205,212,.4),
        inset 0 0 60px rgba(255,255,255,.28);
      animation: breathe 4.2s ease-in-out infinite;
    }
    .orb::before, .orb::after {
      content: "";
      position: absolute; inset: -18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,79,154,.28), transparent 60%);
      animation: drift 7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb::after {
      inset: -8%;
      background: radial-gradient(circle at 70% 60%, rgba(201,205,212,.55), transparent 55%);
      animation-duration: 5.5s;
    }
    .orb.speaking {
      animation: pulseTalk 1.1s ease-in-out infinite;
      box-shadow:
        0 0 100px rgba(255,79,154,.45),
        0 0 180px rgba(201,205,212,.55),
        inset 0 0 60px rgba(255,255,255,.3);
    }
    .orb.listening {
      animation: listenPulse 1.8s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes pulseTalk {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.08); filter: brightness(1.08); }
    }
    @keyframes listenPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: .92; }
    }
    @keyframes drift {
      from { transform: translate(-4%, -2%) rotate(0deg); }
      to { transform: translate(5%, 3%) rotate(12deg); }
    }

    .status-block { text-align: center; margin-top: 8px; }
    .status-text {
      font-size: 15px; font-weight: 650; color: var(--ink);
      min-height: 24px;
    }
    .status-sub { margin-top: 6px; color: var(--muted); font-size: 13px; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 22px 20px 28px;
      border-top: 1px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.25);
    }
    .ctrl {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1px solid rgba(26,35,50,.08);
      background: rgba(255,255,255,.85);
      display: grid; place-items: center;
      color: var(--ink);
      transition: transform .15s, background .15s;
    }
    .ctrl:hover { transform: translateY(-2px); }
    .ctrl svg { width: 22px; height: 22px; }
    .ctrl.muted { background: #EEF1F5; color: var(--muted); }
    .ctrl.end {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #FF6B9D, #FF4F9A);
      border: 0; color: #fff;
      box-shadow: 0 12px 28px rgba(255,79,154,.35);
    }
    .ctrl.primary-gen {
      width: auto; min-width: 160px; height: 52px; border-radius: 999px;
      padding: 0 20px; gap: 8px;
      background: var(--ink); color: #fff; border: 0;
      font-weight: 700; font-size: 14px;
      display: none; align-items: center; justify-content: center;
    }
    .ctrl.primary-gen.show { display: inline-flex; }
    .ai-note {
      text-align: center;
      padding: 0 0 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    .panel {
      border-radius: 22px;
    }
    .panel-head {
      padding: 16px 18px 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-head h2 { margin: 0; font-size: 15px; font-weight: 800; }
    .progress-pills { display: flex; gap: 6px; }
    .progress-pills i {
      width: 28px; height: 6px; border-radius: 99px;
      background: #E4E9F0; font-style: normal;
    }
    .progress-pills i.done { background: var(--ink); }
    .progress-pills i.active { background: var(--pink); }

    .transcript {
      height: 280px;
      overflow-y: auto;
      padding: 4px 18px 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .bubble {
      max-width: 92%;
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.55;
    }
    .bubble.ai {
      align-self: flex-start;
      background: var(--pink-soft);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      align-self: flex-end;
      background: #EEF0F3;
      color: var(--ink);
      border-bottom-right-radius: 4px;
    }
    .bubble .who { display: block; font-size: 11px; font-weight: 700; opacity: .65; margin-bottom: 4px; }

    .extract { padding: 4px 18px 18px; display: grid; gap: 10px; }
    .field {
      background: #FBFCFF;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .field .val { font-size: 13px; font-weight: 600; min-height: 18px; }
    .field.empty .val { color: #B0BCC9; font-weight: 500; }
    .field[hidden] { display: none; }

    .composer {
      display: flex; gap: 8px; padding: 0 18px 16px;
    }
    .composer input {
      flex: 1; border: 1px solid #D5DEE8; border-radius: 12px;
      padding: 11px 12px; outline: 0; background: #fff; font: inherit; font-size: 13px;
    }
    .composer input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,79,154,.14); }
    .composer button {
      border: 0; border-radius: 12px; padding: 0 16px;
      background: var(--ink); color: #fff; font-weight: 700; font-size: 13px;
    }

    .result-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(18, 22, 36, .45);
      backdrop-filter: blur(6px);
      z-index: 40;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .result-overlay.show { display: flex; }
    .result-card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.2);
    }
    .result-card h3 { margin: 0 0 6px; font-size: 22px; }
    .result-card .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .result-meta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;
    }
    .result-meta div {
      background: #F6F8FB; border-radius: 12px; padding: 12px;
    }
    .result-meta span { display: block; color: var(--muted); font-size: 11px; }
    .result-meta b { display: block; margin-top: 4px; font-size: 13px; }
    .steps-mini { display: grid; gap: 8px; margin-bottom: 20px; }
    .steps-mini div {
      display: flex; gap: 10px; align-items: center;
      border: 1px solid #E8EEF5; border-radius: 10px; padding: 10px;
      font-size: 13px;
    }
    .steps-mini i {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--pink-soft); color: var(--pink);
      display: grid; place-items: center;
      font-style: normal; font-size: 11px; font-weight: 800;
    }
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .result-actions .btn {
      border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 14px;
    }
    .btn-main { background: var(--pink); color: #fff; }
    .btn-sec { background: #EEF2F6; color: var(--ink); }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px);
      opacity: 0; pointer-events: none;
      background: var(--ink); color: #fff;
      padding: 11px 16px; border-radius: 12px; font-size: 13px;
      transition: .22s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .stage { grid-template-columns: 1fr; padding: 12px 16px 32px; }
      .orb-panel { min-height: 480px; }
      .transcript { height: 220px; }
      .topbar { padding: 14px 16px 0; flex-wrap: wrap; }
      .fork-cite { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <img src="assets/hero-chrome-ornament.png" alt="" aria-hidden="true" style="position:fixed;right:-8%;top:-12%;width:min(640px,70vw);opacity:.55;pointer-events:none;z-index:0">
  <div class="topbar">
    <a class="brand" href="pet-demo/"><img src="assets/douyin-campus-logo.png" alt=""><span><em>Wowgrowth</em></span></a>
    <div class="fork-cite glass" id="forkCite" hidden></div>
    <div class="scenario glass">
      <span aria-hidden="true">▦</span>
      <label for="scenarioSelect">访谈情景</label>
      <select id="scenarioSelect">
        <option value="career">实习 / 求职经验</option>
        <option value="campus">社团 / 校园项目</option>
        <option value="research">科研 / 保研</option>
        <option value="study">学习方法</option>
      </select>
    </div>
    <div class="top-actions">
      <button type="button" class="chip" id="captionToggle">字幕开</button>
      <a class="chip" href="pet-demo/">退出</a>
    </div>
  </div>

  <main class="stage">
    <section class="orb-panel glass" aria-label="语音访谈舞台">
      <div class="orb-stage">
        <div class="orb listening" id="orb" aria-hidden="true"></div>
        <div class="status-block">
          <div class="status-text" id="statusText">准备开始访谈</div>
          <div class="status-sub" id="statusSub">点击下方麦克风，或直接在右侧输入回答</div>
        </div>
      </div>
      <div class="controls">
        <button type="button" class="ctrl" id="micBtn" title="麦克风" aria-label="切换麦克风">
          <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
        </button>
        <button type="button" class="ctrl" id="notesBtn" title="访谈笔记" aria-label="聚焦笔记面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8a2 2 0 0 1 2 2v14l-6-3-6 3V6a2 2 0 0 1 2-2z"/></svg>
        </button>
        <button type="button" class="ctrl primary-gen" id="genBtn">交给 skill-creator 生成</button>
        <button type="button" class="ctrl end" id="endBtn" title="结束访谈" aria-label="结束访谈">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="ai-note">内容由 AI 生成 · 访谈信息仅用于生成本地 Skill 草稿</div>
    </section>

    <aside class="side">
      <section class="panel glass">
        <div class="panel-head">
          <h2 class="display">访谈对话</h2>
          <div class="progress-pills" id="progressPills" aria-label="访谈进度">
            <i class="active"></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="transcript" id="transcript" aria-live="polite"></div>
        <div class="composer">
          <input id="textInput" type="text" placeholder="也可以打字回答…" aria-label="输入回答">
          <button type="button" id="sendBtn">发送</button>
        </div>
      </section>

      <section class="panel glass" id="notesPanel">
        <div class="panel-head">
          <h2 class="display">已沉淀信息</h2>
          <span style="font-size:12px;color:var(--muted)" id="fillCount">0 / 4</span>
        </div>
        <div class="extract">
          <div class="field empty" id="fDelta" hidden><label>相对原作的改动</label><div class="val">—</div></div>
          <div class="field empty" id="fExperience"><label>核心经验</label><div class="val">等待你讲述…</div></div>
          <div class="field empty" id="fGoal"><label>最终成果</label><div class="val">—</div></div>
          <div class="field empty" id="fPeople"><label>适合谁</label><div class="val">—</div></div>
          <div class="field empty" id="fObstacle"><label>易卡点</label><div class="val">—</div></div>
        </div>
      </section>
    </aside>
  </main>

  <div class="result-overlay" id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <h3 class="display" id="resultTitle">Skill 草稿已生成</h3>
      <p class="sub">访谈信息已交给 skill-creator，生成可运行的成长 Skill 初稿。</p>
      <div class="result-meta">
        <div><span>Skill 名称</span><b id="outTitle">—</b></div>
        <div><span>预计耗时</span><b>12 分钟</b></div>
        <div><span>适合谁</span><b id="outPeople">—</b></div>
        <div><span>最终成果</span><b id="outGoal">—</b></div>
      </div>
      <div class="steps-mini" id="outSteps"></div>
      <div class="result-actions">
        <button type="button" class="btn btn-main" id="publishDraft">发布到试用池</button>
        <a class="btn btn-sec" id="previewLink" href="skill-detail.html?id=resume">预览功能页</a>
        <button type="button" class="btn btn-sec" id="continueEdit">继续补充访谈</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="creators-data.js"></script>
  <script>
    const originTitles = {
      resume: "社团经历项目化表达",
      career: "内容运营实习上岸路线",
      research: "科研入门：从读论文到找选题",
      demo: "竞赛 Demo 一周共创营",
      exam: "期末复习计划生成器",
      interview: "运营岗模拟面试追问",
      "resume-sysu": "中大迎新晚会 · 社团口径版",
      "resume-quant": "没有后台数据时怎么量化",
      "resume-sysu-cs": "中大计院竞赛经历版",
      "career-xhs": "小红书内容实习 28 天",
      "exam-lab": "实验课期末双线突击"
    };
    const remixLanding = {
      resume: "resume-sysu",
      career: "career-xhs",
      exam: "exam-lab",
      "resume-sysu": "resume-sysu-cs"
    };

    const params = new URLSearchParams(location.search);
    const forkId = params.get("fork");
    const forkTitle = forkId && originTitles[forkId];
    const isFork = Boolean(forkTitle);
    const bountyId = params.get("bounty");
    const bountyFor = params.get("for");
    const bounty = bountyId ? bountyById(bountyId) : null;
    const bountyOwner = bountyFor ? creatorById(bountyFor) : (bounty ? creatorById(bounty.ownerId) : null);
    const isBounty = Boolean(bounty && bountyOwner);

    if (isBounty && !isClaimedByMe(bounty.id)) {
      claimBounty(bounty.id, "林");
    }

    const baseQuestions = [
      {
        key: "experience",
        ask: "先随便聊聊：你做成过什么，值得别人复用？像和朋友复盘一样说就行。",
        field: "fExperience",
        label: "核心经验"
      },
      {
        key: "goal",
        ask: "这段经历最终拿到了什么结果？比如面试机会、作品、比赛名次。",
        field: "fGoal",
        label: "最终成果"
      },
      {
        key: "people",
        ask: "什么样的同学最适合用你的方法？年级、专业或起点说一下。",
        field: "fPeople",
        label: "适合谁"
      },
      {
        key: "obstacle",
        ask: "他们最容易在哪一步卡住？我会据此写进 Skill 的兜底提示。",
        field: "fObstacle",
        label: "易卡点"
      }
    ];
    const questions = isFork
      ? [
          {
            key: "delta",
            ask: `你在二创「${forkTitle}」。想改什么：校情、专业，还是原作里你踩过的坑？`,
            field: "fDelta",
            label: "相对原作的改动"
          },
          ...baseQuestions
        ]
      : baseQuestions;

    const state = {
      step: 0,
      muted: false,
      captions: true,
      answers: { delta: "", experience: "", goal: "", people: "", obstacle: "" },
      speaking: false
    };

    if (isFork) {
      const cite = document.getElementById("forkCite");
      cite.hidden = false;
      cite.innerHTML = `二创自 <a href="skill-detail.html?id=${encodeURIComponent(forkId)}">${forkTitle}</a>`;
      document.getElementById("fDelta").hidden = false;
      const pills = document.getElementById("progressPills");
      pills.innerHTML = "<i class=\"active\"></i><i></i><i></i><i></i><i></i>";
      document.title = `二创 ${forkTitle} · Wowgrowth`;
      document.getElementById("previewLink").href = `skill-detail.html?id=${remixLanding[forkId] || forkId}`;
    } else if (isBounty) {
      const cite = document.getElementById("forkCite");
      cite.hidden = false;
      cite.innerHTML = `接单：为 <a href="creator.html?id=${encodeURIComponent(bountyOwner.id)}&tab=bounty">${bountyOwner.name}</a> 制作「${bounty.title}」· ${bounty.reward} 积分`;
      document.title = `接单 ${bounty.title} · Wowgrowth`;
      document.getElementById("statusSub").textContent = bounty.need;
    }

    const orb = document.getElementById("orb");
    const statusText = document.getElementById("statusText");
    const statusSub = document.getElementById("statusSub");
    const transcript = document.getElementById("transcript");
    const micBtn = document.getElementById("micBtn");
    const genBtn = document.getElementById("genBtn");
    const toast = document.getElementById("toast");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        if (text) handleAnswer(text);
      };
      recognition.onerror = () => setStatus("没听清，可以再说一次或打字", "也可以点右侧发送");
      recognition.onend = () => {
        if (!state.speaking && !state.muted && state.step < questions.length) {
          setOrb("listening");
          setStatus("正在聆听…", "说完后稍等，或直接打字发送");
        }
      };
    }

    function notice(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setOrb(mode) {
      orb.classList.remove("speaking", "listening");
      if (mode) orb.classList.add(mode);
    }

    function setStatus(main, sub) {
      statusText.textContent = main;
      if (sub) statusSub.textContent = sub;
    }

    function addBubble(who, text) {
      if (!state.captions && who === "ai") return;
      const div = document.createElement("div");
      div.className = `bubble ${who}`;
      div.innerHTML = `<span class="who">${who === "ai" ? "成长助手" : "你"}</span>${text}`;
      transcript.appendChild(div);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function updateProgress() {
      document.querySelectorAll("#progressPills i").forEach((el, i) => {
        el.classList.toggle("done", i < state.step);
        el.classList.toggle("active", i === state.step);
      });
      const needed = questions.length;
      const filled = questions.filter(q => state.answers[q.key]).length;
      document.getElementById("fillCount").textContent = `${filled} / ${needed}`;
      if (filled >= needed) genBtn.classList.add("show");
    }

    function fillField(id, value) {
      const el = document.getElementById(id);
      el.classList.remove("empty");
      el.querySelector(".val").textContent = value;
    }

    function speak(text, after) {
      window.speechSynthesis.cancel();
      if (state.muted) {
        after && after();
        return;
      }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 1.02;
      state.speaking = true;
      setOrb("speaking");
      setStatus("AI 正在说话", "访谈进行中");
      u.onend = () => {
        state.speaking = false;
        after && after();
      };
      window.speechSynthesis.speak(u);
    }

    function askCurrent() {
      if (state.step >= questions.length) {
        setOrb("");
        setStatus("信息已齐，可以一键生成", "点击下方交给 skill-creator");
        genBtn.classList.add("show");
        addBubble("ai", "很好，关键信息已经齐了。我可以把它们交给 skill-creator，一键生成 Skill 草稿。");
        return;
      }
      const q = questions[state.step];
      addBubble("ai", q.ask);
      speak(q.ask, () => {
        setOrb("listening");
        setStatus(state.muted ? "你已静音" : "正在聆听…", "用语音或文字回答都可以");
        if (!state.muted && recognition) {
          try { recognition.start(); } catch (_) {}
        }
      });
      updateProgress();
    }

    function handleAnswer(text) {
      if (state.step >= questions.length) return;
      const q = questions[state.step];
      addBubble("user", text);
      state.answers[q.key] = text;
      fillField(q.field, text);
      state.step += 1;
      updateProgress();
      if (recognition) { try { recognition.stop(); } catch (_) {} }
      setTimeout(askCurrent, 450);
    }

    function startInterview() {
      const hello = isFork
        ? `你好，这是一次二创访谈。我们会保留「${forkTitle}」的骨架，只把你真正改过的经验写进去。`
        : "你好，我是成长助手。接下来用访谈方式帮你把经验沉淀成 Skill。";
      addBubble("ai", hello);
      speak(hello, askCurrent);
    }

    document.getElementById("sendBtn").addEventListener("click", () => {
      const input = document.getElementById("textInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      handleAnswer(text);
    });
    document.getElementById("textInput").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("sendBtn").click();
    });

    micBtn.addEventListener("click", () => {
      state.muted = !state.muted;
      micBtn.classList.toggle("muted", state.muted);
      if (state.muted) {
        window.speechSynthesis.cancel();
        if (recognition) { try { recognition.stop(); } catch (_) {} }
        setOrb("");
        setStatus("你已静音", "可以继续打字回答");
        micBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>`;
      } else {
        setStatus("麦克风已开", "继续访谈");
        micBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>`;
        if (!state.speaking && recognition) { try { recognition.start(); } catch (_) {} }
        setOrb("listening");
      }
    });

    document.getElementById("captionToggle").addEventListener("click", (e) => {
      state.captions = !state.captions;
      e.currentTarget.textContent = state.captions ? "字幕开" : "字幕关";
      e.currentTarget.classList.toggle("on", state.captions);
    });

    document.getElementById("notesBtn").addEventListener("click", () => {
      document.getElementById("notesPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    document.getElementById("endBtn").addEventListener("click", () => {
      window.speechSynthesis.cancel();
      if (recognition) { try { recognition.stop(); } catch (_) {} }
      if (Object.values(state.answers).filter(Boolean).length >= 2) {
        genBtn.classList.add("show");
        setStatus("访谈已结束", "信息足够时可直接生成");
        notice("已结束访谈，可生成草稿");
      } else {
        location.href = "pet-demo/";
      }
    });

    function buildSkill() {
      const a = state.answers;
      const title = a.experience
        ? (a.experience.length > 22 ? a.experience.slice(0, 22) + "…" : a.experience)
        : (isFork ? `${forkTitle} · 二创` : "我的成长经验 Skill");
      document.getElementById("resultTitle").textContent = isFork ? "二创草稿已生成" : "Skill 草稿已生成";
      document.querySelector("#resultOverlay .sub").textContent = isFork
        ? `已基于「${forkTitle}」生成可运行的二创初稿，发布后会挂在原作的二创列表里。`
        : "访谈信息已交给 skill-creator，生成可运行的成长 Skill 初稿。";
      document.getElementById("outTitle").textContent = title + (isFork ? "" : " · Skill");
      document.getElementById("outPeople").textContent = a.people || "有相似起点的同学";
      document.getElementById("outGoal").textContent = a.delta || a.goal || "可复用的成长成果";
      document.getElementById("outSteps").innerHTML = [
        isFork ? `对照原作，写下你改动的部分：${a.delta || "校情 / 专业 / 补丁"}` : "盘点经验中的关键动作与证据",
        "按适合人群改写可执行步骤",
        "针对易卡点加入兜底提示",
        "输出可试跑的 Skill 结构"
      ].map((t, i) => `<div><i>${i + 1}</i><span>${t}</span></div>`).join("");
      document.getElementById("resultOverlay").classList.add("show");
    }

    genBtn.addEventListener("click", () => {
      setStatus("正在调用 skill-creator…", "根据访谈信息生成结构");
      setTimeout(buildSkill, 700);
    });

    document.getElementById("continueEdit").addEventListener("click", () => {
      document.getElementById("resultOverlay").classList.remove("show");
    });
    document.getElementById("publishDraft").addEventListener("click", () => {
      if (isBounty) {
        const result = deliverClaimedBounty(bounty.id);
        notice(result.ok
          ? `已发给 ${bountyOwner.name}，+${result.points} 积分`
          : `已生成，可回 ${bountyOwner.name} 主页完成交付`);
        setTimeout(() => {
          location.href = `creator.html?id=${encodeURIComponent(bountyOwner.id)}&tab=bounty`;
        }, 900);
        return;
      }
      notice(isFork ? "已发布，正在打开二创页" : "已发布到试用池");
      const landing = isFork
        ? (remixLanding[forkId] || forkId)
        : "resume";
      if (typeof recordPublishedSkill === "function") {
        recordPublishedSkill({
          id: "pub-" + Date.now(),
          title: document.getElementById("outTitle").textContent || "新的成长 Skill",
          typeLabel: isFork ? "二创 Skill" : "单 Skill",
          users: "0",
          href: `skill-detail.html?id=${landing}`
        });
      }
      setTimeout(() => { location.href = `skill-detail.html?id=${landing}`; }, 900);
    });

    document.getElementById("scenarioSelect").addEventListener("change", () => {
      notice("已切换访谈情景");
    });

    startInterview();
  </script>
</body>
</html>
