  <style>
    body{min-height:100vh;background:radial-gradient(ellipse 54% 42% at 84% 8%,rgba(255,79,154,.10),transparent 58%),var(--mist)}.page{min-width:0;padding:8px 0 28px}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 18px}.head p{margin:0;color:var(--muted);font-size:14px}.new-task{border:0;border-radius:999px;padding:10px 14px;color:#fff;background:var(--pink);font-size:13px;font-weight:700}
    .layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;min-height:calc(100vh - 190px)}.history,.task-chat{border:1px solid rgba(255,255,255,.78);border-radius:22px;background:rgba(255,255,255,.74);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.history{padding:16px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.history h2{margin:0;font-size:15px}.history span{color:var(--muted);font-size:11px}.task-list{display:grid;gap:8px;margin-top:14px}.task-card{width:100%;text-align:left;border:1px solid transparent;border-radius:13px;padding:12px;color:var(--ink);background:rgba(255,255,255,.56);font:inherit;cursor:pointer}.task-card:hover,.task-card.active{border-color:rgba(255,79,154,.32);background:var(--pink-soft)}.task-card b{display:block;font-size:13px}.task-card span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.task-card em{display:inline-block;margin-top:7px;padding:3px 6px;border-radius:5px;color:var(--pink);background:rgba(255,79,154,.11);font-size:10px;font-style:normal;font-weight:700}.task-card.done em{color:#0F766E;background:rgba(15,118,110,.10)}.history-foot{margin:15px 0 0;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.55}
    .task-chat{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}.chat-head{display:flex;justify-content:space-between;align-items:start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.chat-head h2{margin:0;font-size:17px}.chat-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.status{flex:0 0 auto;padding:6px 9px;border-radius:999px;color:#0F766E;background:rgba(15,118,110,.10);font-size:11px;font-weight:700}.skill-stack{padding:10px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.42)}.stack-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.stack-head b{color:var(--ink)}.stack-add{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--pink);background:#fff;font-size:11px;font-weight:700}.active-skills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.active-skill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 7px;color:#fff;background:var(--ink);font-size:11px}.active-skill.primary{background:var(--pink)}.active-skill button{width:14px;height:14px;border:0;border-radius:50%;color:inherit;background:rgba(255,255,255,.22);font-size:11px;line-height:14px;padding:0}.skill-picker{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.skill-picker.show{display:grid}.picker-item{text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);background:#fff;font-size:11px}.picker-item b{display:block;margin-bottom:2px;font-size:11px}.picker-item span{color:var(--muted);font-size:10px}.picker-item.added{opacity:.45}
    .messages{overflow:auto;padding:22px;display:flex;flex-direction:column;gap:15px}.message{max-width:min(620px,88%);display:flex;gap:9px;align-items:flex-start}.message.user{align-self:flex-end;flex-direction:row-reverse}.message .avatar{width:29px;height:29px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--pink);font-size:11px;font-weight:800}.message.user .avatar{background:var(--ink)}.bubble{padding:12px 14px;border-radius:4px 16px 16px 16px;background:#fff;color:var(--ink);font-size:13px;line-height:1.65;box-shadow:0 7px 20px rgba(28,31,38,.06)}.user .bubble{border-radius:16px 4px 16px 16px;color:#fff;background:var(--ink)}.chat-compose{padding:14px;border-top:1px solid var(--line);background:rgba(255,255,255,.5)}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.quick button{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);background:#fff;font-size:11px}.attachment-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.attachment{display:flex;align-items:center;gap:7px;max-width:220px;padding:6px 8px;border:1px solid rgba(255,79,154,.22);border-radius:10px;background:#fff}.attachment-preview{width:28px;height:28px;display:grid;place-items:center;overflow:hidden;border-radius:6px;color:var(--pink);background:var(--pink-soft);font-size:10px;font-weight:800}.attachment-preview img{width:100%;height:100%;object-fit:cover}.attachment-info{min-width:0;flex:1}.attachment-info b,.attachment-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment-info b{font-size:10px}.attachment-info span{margin-top:1px;color:var(--muted);font-size:9px}.attachment-remove{width:18px;height:18px;border:0;border-radius:50%;color:var(--muted);background:var(--mist);line-height:18px;padding:0;font-size:12px}.compose-row{display:flex;gap:9px;align-items:center;padding:6px 7px 6px 8px;border:1px solid var(--line);border-radius:16px;background:#fff}.attach-btn{width:32px;height:32px;flex:0 0 auto;border:0;border-radius:10px;color:var(--pink);background:var(--pink-soft);font-size:20px;line-height:1}.compose-row input{flex:1;min-width:0;border:0;outline:0;padding:8px 0;color:var(--ink);background:transparent;font:inherit;font-size:13px}.compose-row button:last-child{border:0;border-radius:11px;padding:9px 13px;color:#fff;background:var(--pink);font-size:12px;font-weight:700}.slash-cmd{display:inline-block;margin-bottom:8px;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.16);font-weight:800;letter-spacing:.02em}.user .slash-cmd{background:rgba(255,255,255,.18)}
    @media(max-width:760px){.page{width:min(100% - 22px,1200px)}.head{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.history{display:none}.task-chat{min-height:calc(100vh - 180px)}.messages{padding:16px}.skill-picker{grid-template-columns:1fr}}
  </style>

  <main class="page"><header class="head"><div><p>每次调用 Skill 都会成为一条可继续推进、可沉淀成果的任务。</p></div><button class="new-task" id="newTaskBtn">+ 开启新任务</button></header><div class="layout"><aside class="history"><div class="history-head"><h2>历史任务</h2><span>3 条记录</span></div><div class="task-list" id="taskList"><button class="task-card" data-task="内容运营实习冲刺" data-skill="内容运营实习上岸路线"><b>内容运营实习冲刺</b><span>第 8 天 · 完成第一版运营案例</span><em>进行中</em></button><button class="task-card" data-task="文献综述撰写" data-skill="文献综述撰写 Skill"><b>文献综述撰写</b><span>已整理 8 篇论文的主题与方法</span><em>进行中</em></button><button class="task-card done" data-task="社团经历项目化" data-skill="社团经历项目化表达"><b>社团经历项目化</b><span>已产出 3 条简历项目</span><em>已完成</em></button></div><p class="history-foot">任务会自动记录你调用的 Skill、上传的材料与关键成果。</p></aside><section class="task-chat"><header class="chat-head"><div><h2 id="chatTitle">新的学习对话</h2><p id="chatSubtitle">上传材料或描述学习目标，AI 会帮你选择合适的 Skill。</p></div><span class="status" id="chatStatus">新对话</span></header><section class="skill-stack"><div class="stack-head"><span><b>组合任务</b> · 当前上下文会同步给 AI</span><button class="stack-add" id="skillAddBtn">+ 添加 Skill</button></div><div class="active-skills" id="activeSkills"></div><div class="skill-picker" id="skillPicker"><button class="picker-item" data-skill="笔记整理复习包 Skill"><b>笔记整理复习包 Skill</b><span>把课堂、讲座或阅读材料整理成复习包</span></button><button class="picker-item" data-skill="知识点卡片 Skill"><b>知识点卡片 Skill</b><span>提取重点并生成便于记忆的知识卡片</span></button><button class="picker-item" data-skill="自测题生成 Skill"><b>自测题生成 Skill</b><span>根据材料生成题目、答案和薄弱点复习建议</span></button></div></section><div class="messages" id="messages"></div><div class="chat-compose"><div class="quick"><button data-action="study-pack" data-prompt="整理笔记复习包">整理笔记复习包</button><button data-prompt="请从材料中提取核心知识点，并生成便于记忆的复习卡片">生成知识点卡片</button><button data-prompt="请根据材料生成自测题、参考答案和薄弱点复习建议">生成自测题与答案</button></div><div class="attachment-list" id="attachmentList"></div><div class="compose-row"><button class="attach-btn" id="attachBtn" type="button" aria-label="添加本地素材" title="添加本地文件、图片或视频">+</button><input id="fileInput" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv" hidden><input id="chatInput" placeholder="上传材料，或描述你想整理和复习的内容…" aria-label="输入新的学习任务"><button id="sendBtn">发送</button></div></div></section></div></main>

  <script>
    const params=new URLSearchParams(location.search);const hasSkillParam=params.has('skill');const skillId=params.get('skill')||'';const skillTitle=params.get('title')||(skillId==='literature-review'?'文献综述撰写 Skill':skillId?'已调用 Skill':'');const skillCmd=params.get('cmd')||(skillId?`/${skillId}`:'');const planTask=params.get('task')||'';const fromPlan=params.get('from')==='plan'||Boolean(planTask);const messages=document.getElementById('messages'),input=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn'),fileInput=document.getElementById('fileInput'),attachmentList=document.getElementById('attachmentList'),activeSkillsEl=document.getElementById('activeSkills'),skillPicker=document.getElementById('skillPicker');const attachments=[];let activeSkills=skillTitle?[skillTitle]:[];let conversation=[];let awaitingStudyPack=false;
    function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}function formatText(t){return esc(t).replace(/\n/g,'<br>')}function addMessage(type,content,isHtml=false){const el=document.createElement('div');el.className=`message ${type}`;el.innerHTML=`<span class="avatar">${type==='user'?'林':'F'}</span><div class="bubble">${isHtml?content:formatText(content)}</div>`;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}function size(b){return b<1048576?`${Math.max(1,Math.round(b/1024))} KB`:`${(b/1048576).toFixed(1)} MB`}function badge(f){if(f.type.startsWith('image/'))return'图片';if(f.type.startsWith('video/'))return'视频';if(/pdf/.test(f.type))return'PDF';if(/word|document/.test(f.type)||/\.docx?$/i.test(f.name))return'文档';if(/sheet|excel|csv/.test(f.type)||/\.(csv|xlsx?|xls)$/i.test(f.name))return'表格';return'文件'}
    function renderSkills(){activeSkillsEl.innerHTML=activeSkills.map((s,i)=>`<span class="active-skill ${i===0?'primary':''}">${esc(s)}${i?`<button type="button" data-remove="${esc(s)}">×</button>`:''}</span>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{activeSkills=activeSkills.filter(s=>s!==b.dataset.remove);renderSkills();addMessage('assistant',`已移除 ${b.dataset.remove}，后续任务会继续围绕 ${activeSkills.join('、')} 推进。`)});document.querySelectorAll('.picker-item').forEach(b=>b.classList.toggle('added',activeSkills.includes(b.dataset.skill)))}
    function renderAttachments(){attachmentList.innerHTML=attachments.map((f,i)=>`<div class="attachment"><span class="attachment-preview">${f.type.startsWith('image/')?`<img src="${f.url}" alt="${esc(f.name)}">`:badge(f)}</span><span class="attachment-info"><b>${esc(f.name)}</b><span>${badge(f)} · ${size(f.size)}</span></span><button class="attachment-remove" data-remove-file="${i}">×</button></div>`).join('');document.querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.removeFile);if(attachments[i].url)URL.revokeObjectURL(attachments[i].url);attachments.splice(i,1);renderAttachments()})}
    function initTask(title){document.getElementById('chatTitle').textContent=title.replace(/ Skill$/,'');document.getElementById('chatSubtitle').textContent='Skill 已加入任务，可继续补充材料并推进下一步。';document.getElementById('chatStatus').textContent='Skill 运行中';messages.innerHTML='';conversation=[];addMessage('assistant',`你好，${title} 已经加入“我的任务”。我会基于你后续输入、组合的 Skill 和上传素材，陪你完成可验证的下一步。\n\n先告诉我：你目前已有哪类材料，最想先解决什么？`);conversation.push({role:'assistant',content:`${title} 已加入任务。请用户补充材料和目标。`})}
    function initNewTask(){document.querySelectorAll('.task-card').forEach(x=>x.classList.remove('active'));activeSkills=[];awaitingStudyPack=false;renderSkills();document.getElementById('chatTitle').textContent='新的学习对话';document.getElementById('chatSubtitle').textContent='上传材料或描述学习目标，AI 会帮你选择合适的 Skill。';document.getElementById('chatStatus').textContent='新对话';messages.innerHTML='';conversation=[];input.placeholder='上传材料，或描述你想整理和复习的内容…'}
    function briefFor(id,title,task){const briefs={ 'literature-review':`目标：把今天的阅读收成可写入综述的论点、方法和缺口。\n建议步骤：\n1. 先对照主题 / 方法 / 结论 / 缺口做一张表\n2. 标出 2–3 处可引用的原句\n3. 再生成可直接开写的段落提纲`,'paper-notes':`目标：把这篇文献收成可复用的精读笔记。\n建议步骤：\n1. 按主题 / 方法 / 结论 / 缺口摘录\n2. 标出可直接引用的原句\n3. 写一句「这篇对你问题的贡献」`,'resume-polish':`目标：把这段经历写成可投递的项目条目。\n建议步骤：\n1. 抽出动作、对象、结果和可验证数字\n2. 压成 2–3 条 STAR 项目描述\n3. 按岗位关键词再改一版`,'star-bullets':`目标：用 STAR 把经历改成可验证的子弹点。\n建议步骤：\n1. 写清情境与任务\n2. 补具体行动与结果数字\n3. 压成简历可用的 1–2 行`,'cold-email':`目标：发出一封能被回复的外联邮件。\n建议步骤：\n1. 明确对方、你的请求和对方收益\n2. 起草 120 字内的第一封信\n3. 准备 3 天后的跟进句`,'followup-email':`目标：写一封不打扰、有下一步的跟进邮件。\n建议步骤：\n1. 回顾上封信的请求\n2. 补一条新价值或更新\n3. 给出明确、可点击的下一步`,'interview-drill':`目标：把这个问题练成可复盘的答法。\n建议步骤：\n1. 先写 60 秒版本\n2. 补证据和反问\n3. 再压成面试可说的口播稿`,'data-clean':`目标：把表格整理成能写进报告的结果。\n建议步骤：\n1. 核对字段、缺失和异常值\n2. 明确要回答的问题\n3. 输出可解释的统计结论`,'stats-report':`目标：输出可解释的描述统计与图表解读。\n建议步骤：\n1. 确认核心问题与变量\n2. 给出关键描述统计\n3. 用一句话解释图表含义`,'ppt-outline':`目标：把进展拆成一页一结论的组会 PPT。\n建议步骤：\n1. 列出 5–7 页结构\n2. 每页只留一个结论\n3. 标出需要证据的页`,'speaker-notes':`目标：把汇报收成 3 分钟口播提纲。\n建议步骤：\n1. 开场 20 秒讲清问题\n2. 中间三段各带一条证据\n3. 结尾给下一步与求助点`,'study-outline':`目标：把这件事拆成今天能做完的学习块。\n建议步骤：\n1. 先写清完成标准\n2. 拆成 3 个 25 分钟块\n3. 标出哪一块最该先做`,'research':`目标：把主题收敛成可推进的研究问题。\n建议步骤：\n1. 写下变量和对照\n2. 排除过大或不可测的问题\n3. 给出今天就能验证的一小步`};const body=briefs[id]||`目标：用 ${title} 推进这件事，先给出可验证的下一步。`;return `已加载 ${skillCmd}。\n\n我根据你今日计划「${task||title}」整理了初始需求：\n\n${body}\n\n你可以直接补充材料，或者说「按这个需求开始」。`}
    function initFromPlan(){document.getElementById('chatTitle').textContent=skillTitle.replace(/ Skill$/,'');document.getElementById('chatSubtitle').textContent=planTask?`已从每日计划载入「${planTask}」`:'Skill 已在对话中加载，可直接继续。';messages.innerHTML='';conversation=[];const userLine=planTask?`${skillCmd}\n今日计划：${planTask}`:skillCmd;addMessage('user',`<span class="slash-cmd">${esc(skillCmd)}</span>${planTask?`<div style="margin-top:6px">今日计划：${esc(planTask)}</div>`:''}`,true);conversation.push({role:'user',content:userLine});const brief=briefFor(skillId,skillTitle,planTask);addMessage('assistant',brief);conversation.push({role:'assistant',content:brief});input.placeholder='补充材料，或直接说「按这个需求开始」'}
    function setSending(v){sendBtn.disabled=v;sendBtn.textContent=v?'思考中…':'发送';input.disabled=v}async function send(){const text=input.value.trim();const files=attachments.splice(0);if(!text&&!files.length)return;if(!activeSkills.length&&(/笔记|复习|知识点|自测题|课堂|讲座|阅读材料/.test(text)||files.length))activeSkills=['笔记整理复习包 Skill'];renderSkills();document.getElementById('chatStatus').textContent=activeSkills.length?'Skill 运行中':'对话中';const summary=files.length?`\n\n我上传了：${files.map(f=>`${f.name}（${badge(f)}，${size(f.size)}）`).join('；')}。请告诉我如何把它们纳入当前任务。`:'';addMessage('user',`${text?formatText(text):'我上传了本地素材，请帮我判断下一步。'}${files.map(f=>`<div style="margin-top:6px;font-size:11px;opacity:.88">附件 · ${esc(f.name)}（${badge(f)}，${size(f.size)}）</div>`).join('')}`,true);conversation.push({role:'user',content:`${text||'我上传了本地素材，请帮我判断下一步。'}${summary}`});files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));renderAttachments();input.value='';setSending(true);const typing=addMessage('assistant',activeSkills.length?`正在根据 ${activeSkills.join('、')} 整理你的材料…`:'正在理解你的学习目标…');try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:conversation,activeSkills})});const data=await res.json();typing.remove();if(!res.ok)throw new Error(data.error||'对话服务暂时不可用。');conversation.push({role:'assistant',content:data.content});addMessage('assistant',data.content)}catch(e){typing.remove();addMessage('assistant',`暂时无法连接对话服务：${e.message}`)}finally{setSending(false);input.focus()}}
    function readAsBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error(`无法读取 ${file.name}`));reader.readAsDataURL(file)})}
    async function createStudyPack(files){setSending(true);document.getElementById('chatStatus').textContent='正在生成复习包';const typing=addMessage('assistant','正在读取材料并生成：可编辑笔记、知识点、自测卡和复习报告…');try{const totalSize=files.reduce((sum,file)=>sum+file.size,0);if(totalSize>3*1024*1024)throw new Error('文件总大小不能超过 3 MB，请压缩或拆分后重试。');const payload=[];for(const file of files)payload.push({name:file.name,type:file.type,size:file.size,data:await readAsBase64(file.file)});const res=await fetch('/api/study-notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:payload})});const data=await res.json();typing.remove();if(!res.ok)throw new Error(data.error||'复习包生成失败。');data.pack.generatedAt=Date.now();sessionStorage.setItem('growth-fork-study-pack-current',JSON.stringify(data.pack));document.getElementById('chatStatus').textContent='复习包已生成';addMessage('assistant',`复习包已经生成。\n\n包含：可编辑文字笔记、视觉总览、知识点、自测卡和复习报告。\n\n<a href="study-notes-demo.html?generated=1" style="display:inline-flex;margin-top:9px;padding:9px 13px;border-radius:11px;color:#fff;background:#ff4f9a;text-decoration:none;font-weight:800">打开笔记复习包 →</a>`,true)}catch(e){typing.remove();document.getElementById('chatStatus').textContent='等待重新上传';awaitingStudyPack=true;addMessage('assistant',`生成失败：${e.message}\n\n请重新上传一份可读取的材料。`)}finally{files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));setSending(false)}}
    function beginStudyPack(){awaitingStudyPack=true;activeSkills=['笔记整理复习包 Skill'];renderSkills();document.getElementById('chatTitle').textContent='笔记整理复习包';document.getElementById('chatSubtitle').textContent='上传材料后自动生成可编辑笔记、知识点、自测卡与复习报告。';document.getElementById('chatStatus').textContent='等待上传';addMessage('user','整理笔记复习包');conversation.push({role:'user',content:'整理笔记复习包'});addMessage('assistant','请点击下方“+”上传 PDF、Word、TXT 或 Markdown 文件。上传完成后我会自动开始生成，不需要再次点击发送。');input.placeholder='等待上传学习材料…';fileInput.click()}
    document.getElementById('skillAddBtn').onclick=()=>skillPicker.classList.toggle('show');document.querySelectorAll('.picker-item').forEach(b=>b.onclick=()=>{if(activeSkills.includes(b.dataset.skill))return;activeSkills.push(b.dataset.skill);renderSkills();document.getElementById('chatStatus').textContent='Skill 运行中';skillPicker.classList.remove('show');addMessage('assistant',`已组合调用 ${b.dataset.skill}。我会在后续对话中明确它与当前学习任务的衔接顺序。`)});document.getElementById('attachBtn').onclick=()=>fileInput.click();fileInput.onchange=()=>{const picked=Array.from(fileInput.files).slice(0,5).map(f=>({name:f.name,type:f.type,size:f.size,file:f,url:''}));fileInput.value='';if(awaitingStudyPack){awaitingStudyPack=false;addMessage('user',picked.map(f=>`<div style="font-size:11px">附件 · ${esc(f.name)}（${badge(f)}，${size(f.size)}）</div>`).join(''),true);createStudyPack(picked);return}picked.forEach(f=>attachments.push(f));renderAttachments()};sendBtn.onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{if(b.dataset.action==='study-pack'){beginStudyPack();return}input.value=b.dataset.prompt;send()});document.getElementById('newTaskBtn').onclick=()=>{initNewTask();input.focus()};document.getElementById('taskList').onclick=e=>{const card=e.target.closest('.task-card');if(!card)return;document.querySelectorAll('.task-card').forEach(x=>x.classList.toggle('active',x===card));activeSkills=[card.dataset.skill];renderSkills();document.getElementById('chatStatus').textContent='Skill 运行中';initTask(card.dataset.task)};renderSkills();if(fromPlan)initFromPlan();else if(hasSkillParam)initTask(skillTitle);else initNewTask();
  </script>
</body>
