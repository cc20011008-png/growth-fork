<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的任务 · 成长 Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <style>
    body{min-height:100vh;background:radial-gradient(ellipse 54% 42% at 84% 8%,rgba(255,79,154,.10),transparent 58%),var(--mist)}.page{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:22px 0 28px}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:9px;align-items:center;color:var(--ink);text-decoration:none;font-weight:900}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--pink);font-family:Outfit,sans-serif}.back{color:var(--muted);text-decoration:none;font-size:13px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:26px 0 18px}.head h1{margin:0;font-size:31px;letter-spacing:-.04em}.head p{margin:6px 0 0;color:var(--muted);font-size:14px}.new-task{border:0;border-radius:999px;padding:10px 14px;color:#fff;background:var(--pink);font-size:13px;font-weight:700}
    .layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;min-height:calc(100vh - 190px)}.history,.task-chat{border:1px solid rgba(255,255,255,.78);border-radius:22px;background:rgba(255,255,255,.74);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.history{padding:16px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.history h2{margin:0;font-size:15px}.history span{color:var(--muted);font-size:11px}.task-list{display:grid;gap:8px;margin-top:14px}.task-card{width:100%;text-align:left;border:1px solid transparent;border-radius:13px;padding:12px;color:var(--ink);background:rgba(255,255,255,.56);font:inherit;cursor:pointer}.task-card:hover,.task-card.active{border-color:rgba(255,79,154,.32);background:var(--pink-soft)}.task-card b{display:block;font-size:13px}.task-card span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.task-card em{display:inline-block;margin-top:7px;padding:3px 6px;border-radius:5px;color:var(--pink);background:rgba(255,79,154,.11);font-size:10px;font-style:normal;font-weight:700}.task-card.done em{color:#0F766E;background:rgba(15,118,110,.10)}.history-foot{margin:15px 0 0;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.55}
    .task-chat{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}.chat-head{display:flex;justify-content:space-between;align-items:start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.chat-head h2{margin:0;font-size:17px}.chat-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.status{flex:0 0 auto;padding:6px 9px;border-radius:999px;color:#0F766E;background:rgba(15,118,110,.10);font-size:11px;font-weight:700}.skill-stack{padding:10px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.42)}.stack-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.stack-head b{color:var(--ink)}.stack-add{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--pink);background:#fff;font-size:11px;font-weight:700}.active-skills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.active-skill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 7px;color:#fff;background:var(--ink);font-size:11px}.active-skill.primary{background:var(--pink)}.active-skill button{width:14px;height:14px;border:0;border-radius:50%;color:inherit;background:rgba(255,255,255,.22);font-size:11px;line-height:14px;padding:0}.skill-picker{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.skill-picker.show{display:grid}.picker-item{text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);background:#fff;font-size:11px}.picker-item b{display:block;margin-bottom:2px;font-size:11px}.picker-item span{color:var(--muted);font-size:10px}.picker-item.added{opacity:.45}
    .messages{overflow:auto;padding:22px;display:flex;flex-direction:column;gap:15px}.message{max-width:min(620px,88%);display:flex;gap:9px;align-items:flex-start}.message.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:29px;height:29px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--pink);font-size:11px;font-weight:800}.user .avatar{background:var(--ink)}.bubble{padding:12px 14px;border-radius:4px 16px 16px 16px;background:#fff;color:var(--ink);font-size:13px;line-height:1.65;box-shadow:0 7px 20px rgba(28,31,38,.06)}.user .bubble{border-radius:16px 4px 16px 16px;color:#fff;background:var(--ink)}.chat-compose{padding:14px;border-top:1px solid var(--line);background:rgba(255,255,255,.5)}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.quick button{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);background:#fff;font-size:11px}.attachment-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}.attachment{display:flex;align-items:center;gap:7px;max-width:220px;padding:6px 8px;border:1px solid rgba(255,79,154,.22);border-radius:10px;background:#fff}.attachment-preview{width:28px;height:28px;display:grid;place-items:center;overflow:hidden;border-radius:6px;color:var(--pink);background:var(--pink-soft);font-size:10px;font-weight:800}.attachment-preview img{width:100%;height:100%;object-fit:cover}.attachment-info{min-width:0;flex:1}.attachment-info b,.attachment-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.attachment-info b{font-size:10px}.attachment-info span{margin-top:1px;color:var(--muted);font-size:9px}.attachment-remove{width:18px;height:18px;border:0;border-radius:50%;color:var(--muted);background:var(--mist);line-height:18px;padding:0;font-size:12px}.compose-row{display:flex;gap:9px;align-items:center;padding:6px 7px 6px 8px;border:1px solid var(--line);border-radius:16px;background:#fff}.attach-btn{width:32px;height:32px;flex:0 0 auto;border:0;border-radius:10px;color:var(--pink);background:var(--pink-soft);font-size:20px;line-height:1}.compose-row input{flex:1;min-width:0;border:0;outline:0;padding:8px 0;color:var(--ink);background:transparent;font:inherit;font-size:13px}.compose-row button:last-child{border:0;border-radius:11px;padding:9px 13px;color:#fff;background:var(--pink);font-size:12px;font-weight:700}
    @media(max-width:760px){.page{width:min(100% - 22px,1200px)}.head{align-items:start;flex-direction:column}.layout{grid-template-columns:1fr}.history{display:none}.task-chat{min-height:calc(100vh - 180px)}.messages{padding:16px}.skill-picker{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page"><nav class="nav"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>成长 Fork</span></a><a class="back" href="index.html">← 返回首页</a></nav><header class="head"><div><h1 class="display">我的任务</h1><p>每次调用 Skill 都会成为一条可继续推进、可沉淀成果的任务。</p></div><button class="new-task" id="newTaskBtn">+ 开启新任务</button></header><div class="layout"><aside class="history"><div class="history-head"><h2>历史任务</h2><span>3 条记录</span></div><div class="task-list" id="taskList"><button class="task-card" data-task="内容运营实习冲刺" data-skill="内容运营实习上岸路线"><b>内容运营实习冲刺</b><span>第 8 天 · 完成第一版运营案例</span><em>进行中</em></button><button class="task-card active" data-task="文献综述撰写" data-skill="文献综述撰写 Skill"><b>文献综述撰写</b><span>已整理 8 篇论文的主题与方法</span><em>进行中</em></button><button class="task-card done" data-task="社团经历项目化" data-skill="社团经历项目化表达"><b>社团经历项目化</b><span>已产出 3 条简历项目</span><em>已完成</em></button></div><p class="history-foot">任务会自动记录你调用的 Skill、上传的材料与关键成果。</p></aside><section class="task-chat"><header class="chat-head"><div><h2 id="chatTitle">文献综述撰写</h2><p id="chatSubtitle">Skill 已加入任务，可继续补充材料并推进下一步。</p></div><span class="status">Skill 运行中</span></header><section class="skill-stack"><div class="stack-head"><span><b>组合任务</b> · 当前上下文会同步给 AI</span><button class="stack-add" id="skillAddBtn">+ 添加 Skill</button></div><div class="active-skills" id="activeSkills"></div><div class="skill-picker" id="skillPicker"><button class="picker-item" data-skill="数据可视化 Skill"><b>数据可视化 Skill</b><span>将变量、方法和数据关系变成图</span></button><button class="picker-item" data-skill="研究问题梳理 Skill"><b>研究问题梳理 Skill</b><span>把主题收敛为可研究的问题</span></button><button class="picker-item" data-skill="问卷数据清洗 Skill"><b>问卷数据清洗 Skill</b><span>整理字段、异常值和分析思路</span></button></div></section><div class="messages" id="messages"></div><div class="chat-compose"><div class="quick"><button data-prompt="我已有的论文主要讨论算法推荐和社会比较">补充已有论文方向</button><button data-prompt="我不知道怎么给这 8 篇论文分类">帮我给论文分类</button><button data-prompt="先帮我生成一个文献综述大纲">生成综述大纲</button></div><div class="attachment-list" id="attachmentList"></div><div class="compose-row"><button class="attach-btn" id="attachBtn" type="button" aria-label="添加本地素材" title="添加本地文件、图片或视频">+</button><input id="fileInput" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md,.csv,.xlsx,.xls,image/*,video/*" hidden><input id="chatInput" placeholder="继续描述你的材料、需求或卡点…" aria-label="继续输入任务需求"><button id="sendBtn">发送</button></div></div></section></div></main>
  <script>
    const params=new URLSearchParams(location.search);const skillId=params.get('skill')||'literature-review';const skillTitle=params.get('title')|| (skillId==='literature-review'?'文献综述撰写 Skill':'已调用 Skill');const messages=document.getElementById('messages'),input=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn'),fileInput=document.getElementById('fileInput'),attachmentList=document.getElementById('attachmentList'),activeSkillsEl=document.getElementById('activeSkills'),skillPicker=document.getElementById('skillPicker');const attachments=[];let activeSkills=[skillTitle];let conversation=[];
    function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}function formatText(t){return esc(t).replace(/\n/g,'<br>')}function addMessage(type,content,isHtml=false){const el=document.createElement('div');el.className=`message ${type}`;el.innerHTML=`<span class="avatar">${type==='user'?'林':'F'}</span><div class="bubble">${isHtml?content:formatText(content)}</div>`;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}function size(b){return b<1048576?`${Math.max(1,Math.round(b/1024))} KB`:`${(b/1048576).toFixed(1)} MB`}function badge(f){if(f.type.startsWith('image/'))return'图片';if(f.type.startsWith('video/'))return'视频';if(/pdf/.test(f.type))return'PDF';if(/word|document/.test(f.type)||/\.docx?$/i.test(f.name))return'文档';if(/sheet|excel|csv/.test(f.type)||/\.(csv|xlsx?|xls)$/i.test(f.name))return'表格';return'文件'}
    function renderSkills(){activeSkillsEl.innerHTML=activeSkills.map((s,i)=>`<span class="active-skill ${i===0?'primary':''}">${esc(s)}${i?`<button type="button" data-remove="${esc(s)}">×</button>`:''}</span>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{activeSkills=activeSkills.filter(s=>s!==b.dataset.remove);renderSkills();addMessage('assistant',`已移除 ${b.dataset.remove}，后续任务会继续围绕 ${activeSkills.join('、')} 推进。`)});document.querySelectorAll('.picker-item').forEach(b=>b.classList.toggle('added',activeSkills.includes(b.dataset.skill)))}
    function renderAttachments(){attachmentList.innerHTML=attachments.map((f,i)=>`<div class="attachment"><span class="attachment-preview">${f.type.startsWith('image/')?`<img src="${f.url}" alt="${esc(f.name)}">`:badge(f)}</span><span class="attachment-info"><b>${esc(f.name)}</b><span>${badge(f)} · ${size(f.size)}</span></span><button class="attachment-remove" data-remove-file="${i}">×</button></div>`).join('');document.querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.removeFile);if(attachments[i].url)URL.revokeObjectURL(attachments[i].url);attachments.splice(i,1);renderAttachments()})}
    function initTask(title){document.getElementById('chatTitle').textContent=title.replace(/ Skill$/,'');document.getElementById('chatSubtitle').textContent='Skill 已加入任务，可继续补充材料并推进下一步。';messages.innerHTML='';conversation=[];addMessage('assistant',`你好，${title} 已经加入“我的任务”。我会基于你后续输入、组合的 Skill 和上传素材，陪你完成可验证的下一步。\n\n先告诉我：你目前已有哪类材料，最想先解决什么？`);conversation.push({role:'assistant',content:`${title} 已加入任务。请用户补充材料和目标。`})}
    function setSending(v){sendBtn.disabled=v;sendBtn.textContent=v?'思考中…':'发送';input.disabled=v}async function send(){const text=input.value.trim();const files=attachments.splice(0);if(!text&&!files.length)return;const summary=files.length?`\n\n我上传了：${files.map(f=>`${f.name}（${badge(f)}，${size(f.size)}）`).join('；')}。请告诉我如何把它们纳入当前任务。`:'';addMessage('user',`${text?formatText(text):'我上传了本地素材，请帮我判断下一步。'}${files.map(f=>`<div style="margin-top:6px;font-size:11px;opacity:.88">附件 · ${esc(f.name)}（${badge(f)}，${size(f.size)}）</div>`).join('')}`,true);conversation.push({role:'user',content:`${text||'我上传了本地素材，请帮我判断下一步。'}${summary}`});files.forEach(f=>f.url&&URL.revokeObjectURL(f.url));renderAttachments();input.value='';setSending(true);const typing=addMessage('assistant',`正在根据 ${activeSkills.join('、')} 整理你的材料…`);try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:conversation,activeSkills})});const data=await res.json();typing.remove();if(!res.ok)throw new Error(data.error||'对话服务暂时不可用。');conversation.push({role:'assistant',content:data.content});addMessage('assistant',data.content)}catch(e){typing.remove();addMessage('assistant',`暂时无法连接对话服务：${e.message}`)}finally{setSending(false);input.focus()}}
    document.getElementById('skillAddBtn').onclick=()=>skillPicker.classList.toggle('show');document.querySelectorAll('.picker-item').forEach(b=>b.onclick=()=>{if(activeSkills.includes(b.dataset.skill))return;activeSkills.push(b.dataset.skill);renderSkills();skillPicker.classList.remove('show');addMessage('assistant',`已组合调用 ${b.dataset.skill}。我会在后续对话中明确它与主 Skill 的衔接顺序。`)});document.getElementById('attachBtn').onclick=()=>fileInput.click();fileInput.onchange=()=>{Array.from(fileInput.files).slice(0,8).forEach(f=>attachments.push({name:f.name,type:f.type,size:f.size,url:f.type.startsWith('image/')?URL.createObjectURL(f):''}));fileInput.value='';renderAttachments()};sendBtn.onclick=send;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;send()});document.getElementById('newTaskBtn').onclick=()=>{activeSkills=['成长任务助手'];renderSkills();initTask('开启一个新任务');input.focus()};document.getElementById('taskList').onclick=e=>{const card=e.target.closest('.task-card');if(!card)return;document.querySelectorAll('.task-card').forEach(x=>x.classList.toggle('active',x===card));activeSkills=[card.dataset.skill];renderSkills();initTask(card.dataset.task)};renderSkills();initTask(skillTitle);
  </script>
</body>
</html>
