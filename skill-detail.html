<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill 功能页 · Wowgrowth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <style>
    body { background: transparent; }
    .shell { max-width: 980px; }

    /* App Store header */
    .app-header {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 22px;
      align-items: start;
      border-radius: 24px;
      padding: 28px;
    }
    .app-icon {
      width: 120px; height: 120px; border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 12px 28px rgba(20,20,22,.12);
    }
    .app-icon.fallback {
      display: grid; place-items: center;
      color: #fff; font-size: 42px; font-weight: 800;
      font-family: Outfit, "Noto Sans SC", sans-serif;
    }
    .app-header h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      line-height: 1.2;
    }
    .handle { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    .rating-line {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      font-size: 13px; color: var(--muted); margin-bottom: 12px;
    }
    .stars { color: #F59E0B; letter-spacing: 1px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--pink-soft); color: var(--pink);
      border-radius: 999px; padding: 3px 9px;
      font-size: 12px; font-weight: 700;
    }
    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 540px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag {
      background: #F1F4F8; color: var(--muted);
      border-radius: 999px; padding: 5px 10px;
      font-size: 12px; font-weight: 600;
    }
    .cta-col { display: flex; flex-direction: column; gap: 10px; align-items: stretch; min-width: 140px; }
    .btn {
      border: 0; border-radius: 12px; padding: 12px 16px;
      font-weight: 750; font-size: 14px; text-align: center;
    }
    .btn-get { background: var(--pink); color: #fff; }
    .btn-share { background: #EEF0F3; color: var(--ink); }
    .btn-remix {
      background: #fff;
      color: var(--ink);
      border: 1px solid rgba(20,20,22,.12);
    }
    .btn-remix:hover { border-color: var(--pink); color: var(--pink); }
    .btn:focus-visible, .tabs button:focus-visible, .pager button:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
    }

    /* Stats row */
    .stats {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-radius: 16px;
      overflow: hidden;
    }
    .stat {
      padding: 16px 12px;
      text-align: center;
      border-right: 1px solid var(--line);
    }
    .stat:last-child { border-right: 0; }
    #statRemix { cursor: pointer; }
    #statRemix:hover b { color: var(--pink); }
    #statRemix:focus-visible { outline: 2px solid var(--pink); outline-offset: -2px; }
    .stat b { display: block; font-size: 20px; font-weight: 800; font-family: Outfit, "Noto Sans SC", sans-serif; }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

    .origin-cite {
      display: flex; align-items: center; gap: 14px;
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 16px;
    }
    .origin-mark {
      width: 40px; height: 40px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--pink-soft); color: var(--pink);
      flex: 0 0 auto;
    }
    .origin-mark svg { width: 18px; height: 18px; }
    .origin-cite .who { font-size: 13px; font-weight: 800; }
    .origin-cite .who a {
      color: var(--pink);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .origin-cite .who a:hover, .origin-cite .chain a:hover { color: var(--pink-deep); }
    .origin-cite .who a:focus-visible, .origin-cite .chain a:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .origin-cite .delta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .origin-cite .chain { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .origin-cite .chain a {
      color: var(--ink); font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .remix-wrap { margin-top: 28px; scroll-margin-top: 18px; }
    .remix-head {
      display: flex; align-items: end; justify-content: space-between;
      gap: 16px; margin-bottom: 12px;
    }
    .remix-head h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .remix-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 52ch; }
    .remix-start {
      color: var(--pink); font-size: 13px; font-weight: 700;
      white-space: nowrap;
    }
    .remix-start:hover { color: var(--pink-deep); }
    .remix-start:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .remix-list { display: grid; gap: 10px; }
    .remix-row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 14px; align-items: center;
      padding: 14px 16px;
      border-radius: 16px;
      transition: transform .18s, box-shadow .18s;
    }
    .remix-row:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .remix-row:focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 2px;
    }
    .remix-ico {
      width: 44px; height: 44px; border-radius: 12px;
      object-fit: cover;
      display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 18px;
      font-family: Outfit, "Noto Sans SC", sans-serif;
      background: var(--ink);
    }
    .remix-row h3 { margin: 0; font-size: 15px; font-weight: 800; }
    .remix-row .delta { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .remix-row .meta {
      color: var(--muted); font-size: 12px;
      white-space: nowrap; text-align: right;
    }
    .remix-row .meta b {
      display: block; color: var(--ink); font-size: 14px;
      font-family: Outfit, "Noto Sans SC", sans-serif;
    }
    .remix-empty {
      padding: 22px 18px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .remix-empty p { margin: 0; color: var(--muted); font-size: 14px; max-width: 52ch; }
    .remix-empty .btn { border-radius: 12px; white-space: nowrap; }

    /* Gallery */
    .gallery-wrap { margin-top: 28px; }
    .gallery-wrap h2 { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
    .gallery {
      display: flex; gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
    }
    .gallery img {
      flex: 0 0 min(420px, 78vw);
      height: 236px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid var(--line);
      scroll-snap-align: start;
      background: #fff;
      box-shadow: var(--shadow);
    }

    /* Tabs */
    .tabs {
      margin-top: 28px;
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }
    .tabs button {
      border: 0; background: transparent;
      color: var(--muted); padding: 14px 16px;
      font-size: 14px; font-weight: 650;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px; white-space: nowrap;
    }
    .tabs button.active { color: var(--ink); border-bottom-color: var(--pink); }
    .tabs .new {
      display: inline-block; margin-left: 6px;
      background: var(--pink); color: #fff;
      font-size: 10px; border-radius: 4px; padding: 1px 5px;
      vertical-align: middle;
    }

    .tab-panel { display: none; margin-top: 22px; }
    .tab-panel.active { display: block; }

    .overview {
      border-radius: 18px;
      padding: 26px;
    }
    .overview h3 { margin: 0 0 10px; font-size: 18px; }
    .overview p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    .overview ul { margin: 0; padding-left: 18px; color: var(--ink); font-size: 14px; }
    .overview li { margin-bottom: 8px; }
    .codechip {
      display: inline-block;
      background: var(--pink-soft); color: var(--pink);
      border-radius: 6px; padding: 2px 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    /* Effect preview */
    .preview-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .case-pill {
      border: 0; border-radius: 999px;
      background: var(--pink); color: #fff;
      padding: 8px 14px; font-size: 13px; font-weight: 700;
    }
    .case-title { flex: 1; color: var(--muted); font-size: 13px; min-width: 200px; }
    .pager { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .pager button {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
    }

    .chat {
      border-radius: 18px;
      padding: 22px;
      min-height: 360px;
    }
    .msg-user {
      display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 18px;
    }
    .msg-user .bubble {
      max-width: 70%;
      background: var(--pink-soft);
      border: 1px solid rgba(255,79,154,.22);
      border-radius: 16px 16px 4px 16px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .avatar-u {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #FF7AB0, #FF4F9A);
      flex: 0 0 auto;
    }
    .msg-ai { display: flex; gap: 10px; align-items: flex-start; }
    .avatar-ai {
      width: 28px; height: 28px; border-radius: 8px;
      background: #111; color: #fff;
      display: grid; place-items: center; font-size: 12px;
      flex: 0 0 auto; margin-top: 4px;
    }
    .ai-body {
      flex: 1;
      background: rgba(255,255,255,.72);
      border-radius: 14px;
      padding: 18px 18px 8px;
      font-size: 14px;
    }
    .ai-body h4 { margin: 0 0 8px; font-size: 16px; }
    .ai-body .chapter { font-weight: 800; margin: 12px 0 6px; }
    .ai-body p { margin: 0 0 12px; color: #3A4654; line-height: 1.7; }

    .muted-box {
      border-radius: 16px;
      padding: 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .comment-lead {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      max-width: 62ch;
    }
    .pet-comment .comment-user { margin-bottom: 4px; }

    @media (max-width: 780px) {
      .app-header { grid-template-columns: 84px 1fr; }
      .app-icon { width: 84px; height: 84px; border-radius: 20px; }
      .cta-col { grid-column: 1 / -1; flex-direction: column; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--line); }
      .gallery img { height: 190px; }
      .remix-row { grid-template-columns: 44px 1fr; }
      .remix-row .meta { grid-column: 2; text-align: left; }
      .remix-empty { flex-direction: column; align-items: stretch; }
      .remix-head { align-items: start; flex-direction: column; }
    }
  </style>
</head>

    <section class="tab-panel" id="tab-comments">

          <span class="stars">★★★★☆</span>
          <strong>${skill.rating}</strong>
          <span>${skill.ratingLabel}</span>
          ${skill.safe ? `<span class="pill">安全</span>` : ""}
          ${skill.origin ? `<span class="pill">二创</span>` : `<span>源自 ${skill.source}</span>`}
        </div>
        <p class="desc">${skill.desc}</p>
        <div class="tags">${skill.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      </div>
      <div class="cta-col">
        <button class="btn btn-get" id="getBtn" type="button">开始使用</button>
        <a class="btn btn-remix" href="create-skill.html?fork=${encodeURIComponent(id)}">二创这个 Skill</a>
        <button class="btn btn-share" id="shareBtn" type="button">分享</button>
      </div>
    `;

    const originBox = document.getElementById("originCite");
    const parentId = skill.origin;
    const parent = parentId && catalog[parentId];
    if (parent) {
      const chain = lineageIds(id);
      const rootId = chain[chain.length - 1];
      const root = rootId && rootId !== parentId ? catalog[rootId] : null;
      originBox.hidden = false;
      originBox.className = "origin-cite glass";
      originBox.innerHTML = `
        <div class="origin-mark">${forkSvg}</div>
        <div>
          <div class="who">二创自 <a href="skill-detail.html?id=${parentId}">${parent.title}</a></div>
          <div class="delta">${skill.delta ? `本版改动：${skill.delta}` : `基于 ${parent.handle} 迭代。`}</div>
          ${root ? `<div class="chain">原创 <a href="skill-detail.html?id=${rootId}">${root.title}</a></div>` : ""}
        </div>
      `;
    }

    const remixList = remixesOf(id);
    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${skill.rating}</b><span>评分</span></div>
      <div class="stat"><b>${skill.users}</b><span>使用人数</span></div>
      <div class="stat"><b>${skill.rate}</b><span>完成率</span></div>
      <div class="stat" id="statRemix" role="link" tabindex="0"><b>${remixList.length ? skill.forks : "0"}</b><span>二创</span></div>
    `;
    const jumpRemix = () => document.getElementById("remixes").scrollIntoView({ behavior: "smooth", block: "start" });
    document.getElementById("statRemix").addEventListener("click", jumpRemix);
    document.getElementById("statRemix").addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jumpRemix(); }
    });

    const remixWrap = document.getElementById("remixes");
    remixWrap.innerHTML = `
      <div class="remix-head">
        <div>
          <h2 class="display" id="remixTitle">二创列表</h2>
          <p>Skill 也是经验，后来者可以按校情、专业或失败补丁改一版。</p>
        </div>
        <a class="remix-start" href="create-skill.html?fork=${encodeURIComponent(id)}">基于此二创 →</a>
      </div>
      ${remixList.length
        ? `<div class="remix-list">${remixList.map(item => `
            <a class="remix-row glass" href="skill-detail.html?id=${item.id}">
              ${iconHtml(item, "remix-ico")}
              <div>
                <h3>${item.title}</h3>
                <p class="delta">${item.delta || item.desc}</p>
              </div>
              <div class="meta"><b>${item.users}</b>人在用</div>
            </a>`).join("")}</div>`
        : `<div class="remix-empty glass">
            <p>还没有人二创。你走过的校情、专业差异或失败补丁，可以成为下一条可运行版本。</p>
            <a class="btn btn-get" href="create-skill.html?fork=${encodeURIComponent(id)}">成为第一个二创</a>
          </div>`}
    `;

    document.getElementById("gallery").innerHTML = skill.gallery
      .map(src => `<img src="${src}" alt="功能预览图">`).join("");

    document.getElementById("tab-overview").innerHTML = `
      <article class="overview glass">
        <h3 class="display">${skill.overviewTitle}</h3>
        <p>从「知道要做什么」到「能跟着完成并产出成果」。</p>
        <ul>${skill.overview.map(x => `<li>${x}</li>`).join("")}</ul>
        <p style="margin-top:16px">运行时通过结构化步骤引导用户，关键产出会写入可复制结果，而不是只给一段建议。</p>
        <p>演示标识：效果预览为合成示例，便于理解 Skill 能力。</p>
      </article>
    `;

    function renderCase() {
      const c = skill.cases[caseIdx];
      document.getElementById("casePill").textContent = `使用案例 ${caseIdx + 1}`;
      document.getElementById("caseTitle").textContent = c.prompt;
      document.getElementById("caseIndex").textContent = `${caseIdx + 1}/${skill.cases.length}`;
      document.getElementById("chatPreview").innerHTML = `
        <div class="msg-user">
          <div class="bubble">${c.prompt}</div>
          <div class="avatar-u" aria-hidden="true"></div>
        </div>
        <div class="msg-ai">
          <div class="avatar-ai" aria-hidden="true">✦</div>
          <div class="ai-body">
            <h4>${c.title}</h4>
            <div class="chapter">${c.chapter}</div>
            ${c.body.map(p => `<p>${p}</p>`).join("")}
          </div>
        </div>
      `;
    }

    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      });
    });

    (function renderComments() {
      const host = document.getElementById("skillComments");
      const list = typeof skillCommentsFor === "function" ? skillCommentsFor(id, displayTitle) : [];
      const tab = document.getElementById("commentsTab");
      if (tab) tab.textContent = list.length ? `评论 · ${list.length}` : "评论";
      if (!list.length) {
        host.innerHTML = `<div class="muted-box glass">还没有宠物评价。用过这条 Skill 并完成学习对话后，评价会出现在这里。</div>`;
        return;
      }
      host.innerHTML = list.map(c => `
        <article class="pet-comment">
          <p class="comment-user">${c.userName} · ${c.userSchool} · ${c.completedAt}</p>
          ${renderPetReviewHtml(c, { public: true })}
        </article>`).join("");
      bindPetReviewShots(host);
    })();

    const wantComments = new URLSearchParams(location.search).get("tab") === "comments";
    if (wantComments) {
      const commentsBtn = document.querySelector('.tabs [data-tab="comments"]');
      if (commentsBtn) commentsBtn.click();
    }

    document.getElementById("prevCase").addEventListener("click", () => {
      caseIdx = (caseIdx - 1 + skill.cases.length) % skill.cases.length;
      renderCase();
    });
    document.getElementById("nextCase").addEventListener("click", () => {
      caseIdx = (caseIdx + 1) % skill.cases.length;
      renderCase();
    });

    document.getElementById("getBtn").addEventListener("click", () => {
      location.href = `pet-demo/?skill=${encodeURIComponent(id)}&title=${encodeURIComponent(displayTitle)}`;
    });
    document.getElementById("shareBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        notice("链接已复制");
      } catch {
        notice("请手动复制浏览器地址");
      }
    });

    document.title = `${displayTitle} · Wowgrowth`;
    renderCase();
    if (location.hash === "#remixes") {
      requestAnimationFrame(jumpRemix);
    }
  </script>
</body>
</html>
