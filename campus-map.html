<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附近的 Skill 创作者 · 成长 Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="brand.css">
  <style>
    .head {
      display: flex; justify-content: space-between; align-items: end;
      gap: 16px; margin: 0 0 12px;
    }
    .head h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .head p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .here {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    .here i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 0 4px var(--pink-soft);
    }

    .stage {
      position: relative;
      height: min(72dvh, 720px);
      min-height: 520px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: var(--shadow);
    }
    #map {
      position: absolute; inset: 0;
      z-index: 1;
      filter: saturate(.45) grayscale(.18);
    }
    .leaflet-container { font-family: inherit; background: #E6E8ED; }
    .leaflet-control-zoom a {
      color: var(--ink) !important;
      background: rgba(247,247,249,.92) !important;
      border: 0 !important;
      width: 34px !important; height: 34px !important;
      line-height: 34px !important;
    }
    .leaflet-control-zoom a:hover { color: var(--pink) !important; }
    .leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
    .leaflet-popup-content-wrapper {
      background: rgba(247,247,249,.94);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 16px;
      box-shadow: var(--shadow);
      color: var(--ink);
      padding: 0;
    }
    .leaflet-popup-content { margin: 12px 14px 14px; width: 220px !important; }
    .leaflet-popup-tip { background: rgba(247,247,249,.94); }
    .leaflet-popup-close-button { color: var(--muted) !important; }

    .creator-pin {
      width: 46px; height: 46px; padding: 0;
      border: 2.5px solid #fff; border-radius: 50%;
      overflow: hidden;
      background: #141416;
      box-shadow: 0 10px 22px rgba(20,20,22,.22);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .creator-pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .creator-pin:hover, .creator-pin:focus-visible {
      transform: scale(1.12);
      outline: 3px solid rgba(255,79,154,.45);
      outline-offset: 0;
    }
    .creator-pin.selected {
      transform: scale(1.16);
      box-shadow: 0 12px 28px rgba(20,20,22,.22);
      outline: 3px solid var(--pink);
    }
    .me-pin {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--pink);
      border: 3px solid #fff;
      box-shadow: 0 0 0 8px rgba(255,79,154,.18), 0 6px 16px rgba(20,20,22,.2);
    }

    .hud {
      position: absolute; z-index: 4; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: start;
      gap: 12px; pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    .count-chip, .locate {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 12px; font-weight: 700;
    }
    .locate {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink);
    }
    .locate svg { display: block; }

    .rail {
      position: absolute; z-index: 4;
      top: 58px; right: 14px; bottom: 14px;
      width: min(320px, calc(100% - 28px));
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .rail > * { pointer-events: auto; }
    .list {
      flex: 1; min-height: 0;
      overflow: auto;
      border-radius: 18px;
      padding: 10px;
    }
    .list-item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px; align-items: center;
      width: 100%;
      border: 0; background: transparent;
      text-align: left;
      padding: 8px; border-radius: 12px;
      cursor: pointer;
    }
    .list-item:hover, .list-item.selected { background: rgba(255,79,154,.1); }
    .list-item img {
      width: 42px; height: 42px; border-radius: 50%;
      object-fit: cover; border: 2px solid #fff;
    }
    .list-item b { display: block; font-size: 13px; }
    .list-item span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .list-item em {
      font-style: normal; color: var(--muted); font-size: 11px; white-space: nowrap;
    }

    .preview {
      border-radius: 18px;
      padding: 14px;
    }
    .preview-top { display: flex; gap: 12px; align-items: center; }
    .preview-top img {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover; border: 2px solid #fff;
    }
    .preview h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .preview .meta { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .preview .bio { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .preview-stats {
      display: flex; gap: 14px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
    }
    .preview-stats b { color: var(--ink); }
    .preview-actions { display: flex; gap: 8px; margin-top: 12px; }
    .preview-actions .btn { flex: 1; }
    .btn-follow[aria-pressed="true"] {
      background: var(--pink-soft); color: var(--pink);
    }

    .map-note {
      position: absolute; z-index: 4; left: 14px; bottom: 14px;
      max-width: 280px; color: var(--muted);
      border-radius: 12px; padding: 8px 10px; font-size: 11px;
    }

    .popup-card b { display: block; font-size: 14px; }
    .popup-card span { display: block; margin: 3px 0 8px; color: var(--muted); font-size: 12px; }
    .popup-card .row { display: flex; gap: 8px; }

    @media (max-width: 860px) {
      .stage { height: auto; min-height: 0; display: grid; grid-template-rows: 420px auto; }
      #map { position: relative; min-height: 420px; }
      .rail {
        position: relative; inset: auto;
        width: auto; padding: 12px;
        max-height: none;
      }
      .list { max-height: 220px; }
      .map-note { display: none; }
      .hud { right: auto; }
    }
  </style>
</head>
<body>
  <!--
    THESIS: Nearby Skill creators as living map pins, not a static campus heat photo.
    OWN-WORLD: Silver Carto map, pink-ringed portrait pins, chrome-rim glass HUD.
    STORY: Pan the campus, tap a face, enter their Skill shelf, follow them.
    FIRST VIEWPORT: Full interactive map of Beijing campuses with avatar pins and a creator rail.
    FORM: Operate · nearby-people map inside established chrome-pink world.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="index.html"><img src="assets/douyin-campus-logo.png" alt=""><span><em>成长 Fork</em></span></a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="my-tasks.html">学习</a>
        <a href="calendar.html">每日计划</a>
        <a href="school-zone.html">学校专区</a>
        <a class="active" href="campus-map.html">附近 Skill 创作者</a>
        <a href="pet-demo/">我的宠物</a>
      </div>
      <div class="nav-actions">
        <a class="btn btn-ink" href="create-skill.html">语音生成 Skill</a>
        <a class="avatar" href="my-growth.html" aria-label="林的主页" title="林 · 已登录"><img src="assets/avatar-student.png" alt="林" width="40" height="40"></a>
      </div>
    </nav>

    <div class="shell-main">
    <header class="head">
      <div>
        <h1 class="display">附近的 Skill 创作者</h1>
        <p>在校园地图上找人，看他们发布、用过和收藏的 Skill，再决定要不要关注。</p>
      </div>
      <div class="here glass"><i></i>你在清华东门附近</div>
    </header>

    <section class="stage" aria-label="附近创作者地图">
      <div id="map" role="application" aria-label="可缩放拖动的校园地图"></div>
      <div class="hud">
        <div class="count-chip glass" id="countChip">附近 10 位创作者</div>
        <button class="locate glass" type="button" id="locateBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="2.2" fill="currentColor"/>
            <path d="M7 1.2v1.8M7 11v1.8M1.2 7h1.8M11 7h1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          回到我附近
        </button>
      </div>
      <aside class="rail">
        <div class="list glass" id="creatorList"></div>
        <article class="preview glass" id="preview" hidden></article>
      </aside>
      <p class="map-note glass">可拖动、缩放。头像按校园大致位置展示，不精确定位个人。演示数据。</p>
    </section>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="creators-data.js"></script>
  <script>
    const toast = document.getElementById("toast");
    function notice(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    const origin = MY_MAP_ORIGIN;
    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true,
      attributionControl: true
    }).setView([origin.lat, origin.lng], 13);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    const meIcon = L.divIcon({
      className: "",
      html: '<div class="me-pin" title="你的位置"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });
    L.marker([origin.lat, origin.lng], { icon: meIcon, keyboard: false }).addTo(map)
      .bindTooltip("你在这里", { direction: "top", offset: [0, -10] });

    const markers = {};
    let selectedId = GROWTH_CREATORS[0].id;

    function pinIcon(creator, selected) {
      return L.divIcon({
        className: "",
        html: `<div class="creator-pin${selected ? " selected" : ""}"><img src="${creator.avatar}" alt="${creator.name}"></div>`,
        iconSize: [46, 46],
        iconAnchor: [23, 23],
        popupAnchor: [0, -24]
      });
    }

    function popupHtml(c) {
      const on = isFollowing(c.id);
      return `<div class="popup-card">
        <b>${c.name}</b>
        <span>${c.school} · ${followerCount(c)} 粉丝</span>
        <div class="row">
          <button class="btn ${on ? "btn-follow" : "btn-pink"}" type="button" data-follow="${c.id}" aria-pressed="${on}">${on ? "已关注" : "关注"}</button>
          <a class="btn btn-ink" href="creator.html?id=${c.id}">看主页</a>
        </div>
      </div>`;
    }

    GROWTH_CREATORS.forEach(c => {
      const m = L.marker([c.lat, c.lng], { icon: pinIcon(c, false), title: c.name })
        .addTo(map)
        .bindPopup(popupHtml(c), { closeButton: true });
      m.on("click", () => selectCreator(c.id, false));
      m.on("popupopen", () => {
        const node = m.getPopup().getElement();
        if (!node) return;
        const btn = node.querySelector("[data-follow]");
        if (btn) btn.addEventListener("click", () => follow(c.id));
      });
      markers[c.id] = m;
    });

    function renderList() {
      document.getElementById("countChip").textContent = `附近 ${GROWTH_CREATORS.length} 位创作者`;
      document.getElementById("creatorList").innerHTML = GROWTH_CREATORS.map(c => `
        <button class="list-item${c.id === selectedId ? " selected" : ""}" type="button" data-id="${c.id}">
          <img src="${c.avatar}" alt="">
          <span><b>${c.name}</b><span>${c.school} · ${c.role}</span></span>
          <em>${followerCount(c)} 粉丝</em>
        </button>
      `).join("");
    }

    function renderPreview() {
      const c = creatorById(selectedId);
      const el = document.getElementById("preview");
      if (!c) { el.hidden = true; return; }
      const on = isFollowing(c.id);
      el.hidden = false;
      el.innerHTML = `
        <div class="preview-top">
          <img src="${c.avatar}" alt="">
          <div>
            <h2 class="display">${c.name}</h2>
            <p class="meta">${c.school} · ${c.area}</p>
          </div>
        </div>
        <p class="bio">${c.bio}</p>
        <div class="preview-stats">
          <span><b>${followerCount(c)}</b> 粉丝</span>
          <span><b>${c.uses.toLocaleString()}</b> 人用过 TA 的 Skill</span>
          <span><b>${c.published.length}</b> 作品</span>
        </div>
        <div class="preview-actions">
          <button class="btn ${on ? "btn-follow" : "btn-pink"}" type="button" id="previewFollow" aria-pressed="${on}">${on ? "已关注" : "关注"}</button>
          <a class="btn btn-ink" href="creator.html?id=${c.id}">看主页</a>
        </div>
      `;
      document.getElementById("previewFollow").addEventListener("click", () => follow(c.id));
    }

    function selectCreator(id, pan) {
      selectedId = id;
      const c = creatorById(id);
      Object.keys(markers).forEach(key => {
        markers[key].setIcon(pinIcon(creatorById(key), key === id));
      });
      renderList();
      renderPreview();
      if (c && pan !== false) {
        map.flyTo([c.lat, c.lng], Math.max(map.getZoom(), 14), { duration: 0.55 });
        markers[id].openPopup();
      }
    }

    function follow(id) {
      const now = toggleFollow(id);
      const c = creatorById(id);
      notice(now ? `已关注 ${c.name}` : `已取消关注 ${c.name}`);
      markers[id].setPopupContent(popupHtml(c));
      renderList();
      renderPreview();
    }

    document.getElementById("creatorList").addEventListener("click", e => {
      const btn = e.target.closest("[data-id]");
      if (btn) selectCreator(btn.dataset.id, true);
    });
    document.getElementById("locateBtn").addEventListener("click", () => {
      map.flyTo([origin.lat, origin.lng], 14, { duration: 0.5 });
    });

    selectCreator(selectedId, false);
  </script>
</body>
</html>
