<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日计划 · 每日计划 · Wowgrowth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Outfit:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="focus-room.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="pet-demo/">
        <img src="assets/douyin-campus-logo.png" alt="">
        <span><em>Wowgrowth</em></span>
      </a>
      <div class="nav-links">
        <a href="pet-demo/">学习</a>
        <a class="active" href="calendar.html">每日计划</a>
        <a href="school-zone.html">学校专区</a>
        <a href="campus-map.html">附近 Skill 创作者</a>
      </div>
      <div class="nav-actions">
        <a class="btn btn-ink" href="create-skill.html">制作 Skill</a>
        <a class="avatar" href="my-growth.html" aria-label="林的主页" title="林 · 已登录"><img src="assets/avatar-student.png" alt="林" width="40" height="40"></a>
      </div>
    </nav>

    <div class="shell-main">
      <div class="cal-app plan-app" id="learnCalendar">
        <main class="cal-main">
          <header class="cal-head">
            <div>
              <div class="cal-title-row">
                <h1 id="plan-title">每日计划</h1>
                <div class="month-shift" id="date-shift">
                  <button type="button" id="cal-prev" aria-label="上一天">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 6l-6 6 6 6"/></svg>
                  </button>
                  <button type="button" id="cal-next" aria-label="下一天">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6l6 6-6 6"/></svg>
                  </button>
                </div>
              </div>
              <p class="cal-note" id="plan-note">勾选完成的待办，会同步写进日历页</p>
            </div>
            <div class="cal-tools">
              <div class="view-toggle" aria-label="每日计划页面">
                <a href="calendar.html" aria-current="page">日计划</a>
                <a href="plan-calendar.html">日历</a>
              </div>
              <button class="today-btn" type="button" id="cal-today">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
                回到今天
              </button>
            </div>
          </header>

          <section class="todo-board" id="day-view" aria-label="日计划">
            <form class="todo-composer" id="todo-form">
              <input id="todo-input" type="text" maxlength="80" placeholder="写下今天要完成的一件事" autocomplete="off" aria-label="新增待办">
              <button type="submit">添加</button>
            </form>
            <p class="todo-progress" id="todo-progress"></p>
            <ul class="todo-list" id="todo-list"></ul>
            <label class="todo-note">
              <span>今日感悟</span>
              <textarea id="todo-note" rows="2" maxlength="40" placeholder="写一句今天的感受，会出现在日历格子里"></textarea>
            </label>
          </section>
        </main>
      </div>
    </div>
  </div>
  <div class="cal-toast" id="cal-toast" role="status"></div>
  <script src="calendar.js"></script>
</body>
</html>
