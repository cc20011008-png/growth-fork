<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日历 · 每日计划 · 成长 Fork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="focus-room.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="pet-demo/">
        <img src="assets/douyin-campus-logo.png" alt="">
        <span><em>成长 Fork</em></span>
      </a>
      <div class="nav-links">
        <a href="pet-demo/">首页</a>
        <a href="index.html">市集</a>
        <a href="my-tasks.html">学习</a>
        <a class="active" href="calendar.html">每日计划</a>
        <a href="school-zone.html">学校专区</a>
        <a href="campus-map.html">附近 Skill 创作者</a>
      </div>
      <div class="nav-actions">
        <a class="btn btn-ink" href="create-skill.html">语音生成 Skill</a>
        <a class="avatar" href="my-growth.html" aria-label="林的主页" title="林 · 已登录"><img src="assets/avatar-student.png" alt="林" width="40" height="40"></a>
      </div>
    </nav>

    <div class="shell-main">
      <div class="cal-app plan-app month-app" id="learnCalendar">
        <main class="cal-main">
          <header class="cal-head">
            <div>
              <div class="cal-title-row">
                <h1 id="cal-month-label">2026年8月</h1>
                <div class="month-shift">
                  <button type="button" id="cal-prev" aria-label="上一月">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 6l-6 6 6 6"/></svg>
                  </button>
                  <button type="button" id="cal-next" aria-label="下一月">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6l6 6-6 6"/></svg>
                  </button>
                </div>
              </div>
              <p class="cal-note">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.6 5.2L19 9.2l-5.4 1.6L12 16l-1.6-5.2L5 9.2l5.4-1.5L12 2.5z"/></svg>
                小狗根据你的学习自动更新
              </p>
            </div>
            <div class="cal-tools">
              <label>
                <span class="sr-only">视图</span>
                <select class="view-select" id="plan-view" aria-label="日历视图">
                  <option value="calendar.html">日计划</option>
                  <option value="plan-calendar.html" selected>月视图</option>
                </select>
              </label>
              <button class="today-btn" type="button" id="cal-today">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
                回到今天
              </button>
            </div>
          </header>

          <section class="cal-board" aria-label="学习月历">
            <div class="cal-weekdays">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-legend">
              <span><i class="legend-dot"></i>自动战绩 (根据学习自动记录)</span>
              <span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#FF4F9A" aria-hidden="true"><path d="M7.2 18c-2.4 0-4.2-1.9-4.2-4.5C3 9.6 5.8 6.2 10 5.2l.7 1.6C8.2 7.6 6.6 9.4 6.4 11.4c.5-.4 1.2-.6 2-.6 1.8 0 3.1 1.2 3.1 3 0 1.9-1.5 3.2-4.3 3.2zm9.5 0c-2.4 0-4.2-1.9-4.2-4.5 0-3.9 2.8-7.3 7-8.3l.7 1.6c-2.5.8-4.1 2.6-4.3 4.6.5-.4 1.2-.6 2-.6 1.8 0 3.1 1.2 3.1 3 0 1.9-1.5 3.2-4.3 3.2z"/></svg>
                有感悟 (记录学习感悟)
              </span>
            </div>
            <img class="cal-mascot" src="assets/companion-dog-transparent.png" alt="小狗成长搭子">
          </section>

          <section class="day-sheet" id="day-sheet" aria-label="当天计划"></section>
        </main>
      </div>
    </div>
  </div>
  <div class="cal-toast" id="cal-toast" role="status"></div>
  <script src="calendar.js"></script>
</body>
</html>
